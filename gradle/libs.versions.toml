[versions]
agp = "9.4.1"
kotlin = "2.4.21"
kotlinx-coroutines = "1.10.2"
compose = "1.12.1"
compose-ui = "1.7.3"
compose-foundation = "1.7.3"
compose-material3 = "1.3.1"
androidx-activityCompose = "1.11.0"
androidx-lifecycleViewmodelCompose = "2.9.4"
androidx-annotation = "1.9.1"
nexus-publish = "2.0.0"
vanniktech-maven-publish = "0.37.0"
spotless = "6.25.0"
ktlint = "1.6.0"
mlkit-text-recognition = "16.0.1"
litert = "1.4.2"

android-minSdk = "24"
android-compileSdk = "37"
core-ktx = "1.12.0"
junit = "4.13.2"
androidx-test-ext-junit = "1.1.5"
espresso-core = "3.5.1"
appcompat = "1.6.1"
material = "1.11.0"
accompanist = "0.36.0"
camerax = "1.5.1"
exifinterface = "1.3.7"
multiplatform-paging = "3.4.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
