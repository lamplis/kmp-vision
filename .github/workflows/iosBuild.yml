name: iOS Build

on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 17
          distribution: zulu
          cache: gradle

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: 'latest-stable'

      - name: Run xcodebuild
        run: |
          cd sample/ios
          xcodebuild -project VisionSample.xcodeproj -scheme VisionSample -sdk iphonesimulator
