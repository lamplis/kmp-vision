site_name: KMP-Vision
site_url: https://lamplis.github.io/kmp-vision/
site_description: Build shared camera and vision experiences for Android and iOS with Kotlin and Compose Multiplatform.
repo_url: https://github.com/lamplis/kmp-vision
repo_name: lamplis/kmp-vision
docs_dir: docs

theme:
  name: material
  logo: images/mark.svg
  favicon: images/mark.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - search.suggest

nav:
  - Overview: index.md
  - Tutorial: tutorial.md
  - Install: install.md
  - Camera: camera.md
  - Overlay: overlay.md
  - Picker: picker.md
  - OCR: ocr.md
  - Models: models.md
  - Camera and picker: camera-and-picker.md
  - Contributing: contributing.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

copyright: KMP-Vision · Open source under Apache-2.0
